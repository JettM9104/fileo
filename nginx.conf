# /etc/nginx/sites-available/myapp
# Symlink to sites-enabled: sudo ln -s /etc/nginx/sites-available/myapp /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name example.com www.example.com;  # <-- change to your domain

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name example.com www.example.com;  # <-- change to your domain

    # SSL — managed by Certbot (run: sudo certbot --nginx -d example.com)
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (Talisman also sets these; belt-and-suspenders)
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;

    # Rate limit zone — defined in nginx.conf http block (see note below)
    limit_req zone=app burst=20 nodelay;

    # Let Nginx serve static files directly — much faster than Flask
    root /var/www/myapp/public;  # <-- change to your WEB_ROOT

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else goes to Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_buffering    on;
    }
}

# Add this inside the http {} block of /etc/nginx/nginx.conf:
#
#   limit_req_zone $binary_remote_addr zone=app:10m rate=10r/s;
